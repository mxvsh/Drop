name: Release

# Push a tag like v0.2.0 on main to publish a signed, notarized DMG and a Sparkle appcast.
# Nothing personal lives in the repo: the team, certificate and keys come from repository
# secrets, and the Sparkle public key from a repository variable. See README, "Releasing".

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main; releases are cut from main only."; exit 1; }

  build:
    needs: verify
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          test -n "$SPARKLE_PUBLIC_KEY" \
            || { echo "::error::Set the SPARKLE_PUBLIC_KEY repository variable (see README, Releasing)."; exit 1; }

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # The runner context isn't available in job-level env, so export it here.
          echo "KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db" >> "$GITHUB_ENV"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT="$RUNNER_TEMP/build_certificate.p12"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D -o "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          # shellcheck disable=SC2046  # word splitting is intended: one argument per keychain
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

      # The project is saved by Xcode 27 (format 110); the runner's Xcode reads format 77.
      - name: Match the runner's project format
        run: sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' Drop.xcodeproj/project.pbxproj

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project Drop.xcodeproj \
            -scheme Drop \
            -configuration Release \
            -archivePath build/Drop.xcarchive \
            -derivedDataPath build \
            archive \
            MARKETING_VERSION="${TAG#v}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SPARKLE_FEED_URL="https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml" \
            SPARKLE_PUBLIC_KEY="$SPARKLE_PUBLIC_KEY"

      - name: Export signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/Drop.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          codesign --verify --deep --strict --verbose=2 build/export/Drop.app
          plutil -p build/export/Drop.app/Contents/Info.plist | grep -E '"SU(FeedURL|PublicEDKey)"'

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Drop" \
            --window-size 640 360 \
            --icon-size 96 \
            --icon "Drop.app" 180 170 \
            --hide-extension "Drop.app" \
            --app-drop-link 460 170 \
            "Drop-${TAG}.dmg" \
            build/export/Drop.app

      - name: Sign DMG
        run: |
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          test -n "$IDENTITY"
          codesign --force --sign "$IDENTITY" --keychain "$KEYCHAIN_PATH" "Drop-${TAG}.dmg"
          codesign --verify --verbose=2 "Drop-${TAG}.dmg"

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials drop-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

          xcrun notarytool submit "Drop-${TAG}.dmg" \
            --keychain-profile drop-notary \
            --keychain "$KEYCHAIN_PATH" \
            --wait

          xcrun stapler staple "Drop-${TAG}.dmg"
          spctl -a -t open --context context:primary-signature -vv "Drop-${TAG}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: Drop-${{ github.ref_name }}.dmg

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Sparkle's tools ship inside the resolved SPM artifact.
          BIN=$(find build/SourcePackages/artifacts -name generate_appcast -type f | head -1)
          mkdir appcast && cp "Drop-${TAG}.dmg" appcast/
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$BIN" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${TAG}/" \
            appcast

      - uses: actions/upload-artifact@v4
        with:
          name: appcast
          path: appcast/appcast.xml

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dmg

      - uses: actions/download-artifact@v4
        with:
          name: appcast

      - name: Generate release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${flags[@]}" \
            "Drop-${GITHUB_REF_NAME}.dmg" \
            appcast.xml
